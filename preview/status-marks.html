<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.mark{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 18px/1 Roboto}
.stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.stack .lbl{font:400 11px/14px Roboto;color:#6A717D;text-align:center}
</style></head><body><div class="card">
<div class="label" style="margin-bottom:12px">Status marks · custom WellSky circular indicators</div>
<div class="row" style="gap:18px">
<div class="stack"><div class="mark" style="background:#389E0D">✓</div><div class="lbl">Approved</div></div>
<div class="stack"><div class="mark" style="background:#D7A718">⏱</div><div class="lbl">Pending</div></div>
<div class="stack"><div class="mark" style="background:#CF1322">✕</div><div class="lbl">Denied</div></div>
<div class="stack"><div class="mark" style="background:#CF1322">!</div><div class="lbl">Needs Attention</div></div>
<div class="stack"><div class="mark" style="background:#6660A6">↻</div><div class="lbl">Up For Recert</div></div>
<div class="stack"><div class="mark" style="background:#D7A718">⧖</div><div class="lbl">Expiring</div></div>
<div class="stack"><div class="mark" style="background:#276966">●</div><div class="lbl">Active</div></div>
<div class="stack"><div class="mark" style="background:#6A717D">—</div><div class="lbl">Inactive</div></div>
</div>
</div></body></html>
