<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
button{font:500 14px/18px Roboto;cursor:pointer;border-radius:4px;padding:7px 15px;border:1px solid transparent;transition:all .12s ease-out}
.primary{background:#1677FF;color:#fff;border-color:#1677FF}
.primary:hover{background:#2B85FF}
.default{background:#fff;color:#3A424A;border-color:#D8D8D8}
.default:hover{color:#1677FF;border-color:#1677FF}
.danger{background:#fff;color:#CF1322;border-color:#CF1322}
.danger:hover{background:#FFF4F4}
.link{background:transparent;border:none;color:#1677FF;padding:7px 0}
.ghost{background:transparent;color:#1677FF;border-color:#1677FF}
.disabled{background:#F5F5F5;color:#BFBFBF;border-color:#E8E9EA;cursor:not-allowed}
.small{padding:3px 11px;font-size:12px;line-height:16px}
</style></head><body><div class="card">
<div class="label" style="margin-bottom:10px">Buttons</div>
<div class="row" style="gap:8px"><button class="primary">Primary</button><button class="default">Default</button><button class="ghost">Ghost</button><button class="danger">Danger</button><button class="link">Text link</button><button class="disabled">Disabled</button></div>
<div style="height:10px"></div>
<div class="row" style="gap:8px"><button class="primary small">Small</button><button class="default small">Small</button><button class="danger small">Small</button></div>
</div></body></html>
