<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:2px;font:400 12px/20px Roboto;border:1px solid}
.t-blue{background:#E6F4FF;border-color:#91CAFF;color:#1677FF}
.t-green{background:#F6FFED;border-color:#B7EB8F;color:#389E0D}
.t-gold{background:#FFFBE6;border-color:#FFE58F;color:#D7A718}
.t-red{background:#FFF1F0;border-color:#FFA39E;color:#CF1322}
.t-purple{background:#F9F0FF;border-color:#D3ADF7;color:#6660A6}
.t-teal{background:#E6F5F4;border-color:#95CFCD;color:#276966}
.t-gray{background:#FAFAFA;border-color:#D9D9D9;color:#3A424A}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
</style></head><body><div class="card">
<div class="label" style="margin-bottom:10px">Status tags · Ant-style outlined chips (2px radius)</div>
<div class="row">
<span class="tag t-green"><span class="dot" style="background:#389E0D"></span>Approved</span>
<span class="tag t-blue"><span class="dot" style="background:#1677FF"></span>Pending</span>
<span class="tag t-gold"><span class="dot" style="background:#D7A718"></span>Partial Approval</span>
<span class="tag t-red"><span class="dot" style="background:#CF1322"></span>Denied</span>
<span class="tag t-purple"><span class="dot" style="background:#6660A6"></span>Processing</span>
<span class="tag t-teal"><span class="dot" style="background:#276966"></span>Up For Recert</span>
<span class="tag t-red"><span class="dot" style="background:#CF1322"></span>Needs Attention</span>
<span class="tag t-gray">Inactive</span>
<span class="tag t-gold">Expiring</span>
</div>
</div></body></html>
