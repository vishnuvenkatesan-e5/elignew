<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>WellSky — F2F Encounter Audit Flow</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
html,body{margin:0;padding:0;background:#fff;font-family:"Roboto",system-ui,sans-serif;color:#3A424A}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;

// ── Top navy chrome (matches the rest of the prototype) ─────────
function TopNav() {
  return (
    <div style={{height:72,background:"linear-gradient(rgb(56,71,90) 0%, rgb(44,60,80) 42%, rgb(28,45,66) 100%)",display:"flex",alignItems:"center",padding:"0 32px",color:"#fff",gap:28,borderBottom:"1px solid rgba(255,255,255,.1)"}}>
      <img src="../../assets/neos-logo.png" style={{height:26}} alt="neos" />
      <div style={{display:"flex",gap:28,marginLeft:20,font:"400 14px/18px Roboto",color:"rgba(255,255,255,.55)"}}>
        <span>Dashboard</span><span>Patient 360</span><span>Eligibility</span><span>Authorization</span><span>Claims</span><span>Remits</span>
        <span style={{color:"#fff",borderBottom:"2px solid #fff",paddingBottom:4,display:"inline-flex",alignItems:"center",gap:4}}>Audit <span style={{fontSize:9}}>▾</span></span>
        <span>My Tasks</span>
      </div>
      <div style={{marginLeft:"auto",display:"flex",gap:16,alignItems:"center",color:"rgba(255,255,255,.7)",font:"400 13px Roboto"}}>
        <span style={{display:"inline-flex",alignItems:"center",gap:4}}>⚙ Settings <span style={{fontSize:9}}>▾</span></span>
        <span style={{fontSize:16}}>📖</span>
        <div style={{width:28,height:28,borderRadius:"50%",background:"#C6A78F"}}></div>
      </div>
    </div>
  );
}

function SectionBand() {
  return (
    <div style={{background:"linear-gradient(rgb(44,60,80) 0%, rgb(28,45,66) 100%)",padding:"16px 32px 14px",color:"#fff"}}>
      <div style={{font:"500 20px/24px Roboto"}}>Face-To Face Encounter Audit Center</div>
      <div style={{display:"flex",gap:12,alignItems:"center",marginTop:14}}>
        <button style={{background:"#1677FF",color:"#fff",border:"none",borderRadius:4,padding:"6px 14px",font:"500 13px/18px Roboto",display:"inline-flex",alignItems:"center",gap:8}}><span>▦</span>F2F Encounter Audit View</button>
        <button style={{background:"transparent",color:"rgba(255,255,255,.85)",border:"none",font:"400 13px/18px Roboto"}}>Automation Log</button>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10,font:"400 13px Roboto"}}>
          <span>Review Mode</span>
          <span style={{width:32,height:18,borderRadius:999,background:"rgba(255,255,255,.3)",position:"relative",display:"inline-block"}}><span style={{position:"absolute",top:2,left:2,width:14,height:14,borderRadius:"50%",background:"#fff"}}></span></span>
        </div>
      </div>
    </div>
  );
}

// ── Screen 1: F2F Audit table ───────────────────────────────────
function AuditView({ onOpenDetail }) {
  const chips = [
    { label:"All Patients",          value:"120", color:"rgb(21,95,130)" },
    { label:"Requirements Met",      value:"114", color:"rgb(56,158,13)" },
    { label:"Requirements Not Met",  value:"03",  color:"rgb(215,65,65)" },
    { label:"Exceptions",            value:"03",  color:"rgb(215,167,24)" },
  ];
  const rows = [
    { name:"Marvin Mckinney",   mrn:"B6100062245601", branch:"Bcode", src:"Institution", soc:"07/08/25", trig:"485", date:"08/11/25", encDate:"", dueDate:"08/07/25", days:"", sync:"·", at:"warn",  auditor:"E5 Agent", state:"exception" },
    { name:"Rachel Martin",     mrn:"B6789012345685", branch:"Bcode", src:"Institution", soc:"06/06/25", trig:"485", date:"06/07/25", encDate:"", dueDate:"06/06/25", days:"", sync:"·", at:"warn",  auditor:"E5 Agent", state:"exception" },
    { name:"Esther Howard",     mrn:"B6789012345678", branch:"Bcode", src:"Episode",     soc:"06/02/25", trig:"485", date:"06/02/25", encDate:"05/28/25", dueDate:"06/02/25", days:"32", sync:"·", at:"check", auditor:"E5 Agent", state:"met" },
    { name:"Wade Warren",       mrn:"B6789012345685", branch:"Bcode", src:"Episode",     soc:"05/30/25", trig:"485", date:"05/30/25", encDate:"05/25/25", dueDate:"05/30/25", days:"28", sync:"·", at:"check", auditor:"E5 Agent", state:"met" },
    { name:"Cameron Williamson",mrn:"B6100054445634", branch:"Bcode", src:"Episode",     soc:"05/29/25", trig:"485", date:"05/29/25", encDate:"", dueDate:"05/29/25", days:"", sync:"·", at:"warn",  auditor:"E5 Agent", state:"notmet" },
    { name:"Robert Fox",        mrn:"V6789012345686", branch:"Bcode", src:"Episode",     soc:"05/26/25", trig:"485", date:"05/26/25", encDate:"05/22/25", dueDate:"05/26/25", days:"24", sync:"·", at:"check", auditor:"E5 Agent", state:"met" },
    { name:"Jenny Wilson",      mrn:"B6789012345711", branch:"Bcode", src:"Episode",     soc:"05/24/25", trig:"485", date:"05/24/25", encDate:"05/19/25", dueDate:"05/24/25", days:"22", sync:"·", at:"check", auditor:"E5 Agent", state:"met" },
    { name:"Jacob Jones",       mrn:"B6789012345716", branch:"Bcode", src:"Episode",     soc:"05/22/25", trig:"485", date:"05/22/25", encDate:"", dueDate:"05/22/25", days:"", sync:"·", at:"warn",  auditor:"E5 Agent", state:"exception" },
  ];

  const cols = [
    { label:"Name", w:160, sort:true },
    { label:"MRN", w:158, sort:true },
    { label:"Branch", w:90, sort:true },
    { label:"Referral Source", w:108, sort:true },
    { label:"SOC", w:92, sort:true },
    { label:"Audit Trigger", w:108, sort:true },
    { label:"Audit Date", w:104, sort:true },
    { label:"F2F Encounter Date", w:128, sort:true },
    { label:"F2F Encounter Due Date", w:138, info:true },
    { label:"Days Remaining", w:106, info:true },
    { label:"EHR Sync", w:74 },
    { label:"AT Status", w:78 },
    { label:"Auditor", w:96, sort:true },
    { label:"F2F Requirements Met?", w:170, align:"center" },
    { label:"View Details", w:84, align:"center" },
    { label:"Reviewed?", w:88, align:"center" },
  ];

  return (
    <React.Fragment>
      {/* Filter bar */}
      <div style={{background:"rgb(240,245,255)",height:50,display:"flex",alignItems:"center",padding:"0 32px",gap:14,font:"400 13px Roboto",color:"#3A424A"}}>
        <span style={{color:"#6A717D",fontSize:14}}>🛒</span>
        <span style={{background:"#fff",border:"1px solid #D8D8D8",borderRadius:4,padding:"4px 10px"}}>Audit Date : 08/07/25 - 08/12/25 ▾</span>
        <span style={{color:"#6660A6",font:"500 13px Roboto",display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:14,height:14,borderRadius:"50%",background:"#6660A6",color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:11}}>+</span>Add More Filters</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #D8D8D8",borderRadius:4,padding:"4px 12px",minWidth:240}}>
          <span style={{color:"#6A717D"}}>🔍</span>
          <span style={{color:"#8D949D"}}>Search Patient Records</span>
        </div>
      </div>

      {/* Heading + status card */}
      <div style={{padding:"20px 32px 8px",display:"flex",alignItems:"flex-start",gap:32}}>
        <div>
          <div style={{font:"500 18px/22px Roboto",color:"#000"}}>Face To Face Encounter Audit View</div>
          <div style={{font:"400 14px/18px Roboto",color:"#3A424A",marginTop:6}}>Face to Face Audit Details Summary</div>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,marginTop:10,background:"#F7F8FA",border:"1px solid #E8E9EA",borderRadius:6,padding:"4px 10px",font:"400 13px/18px Roboto",color:"#3A424A"}}>
            Click <span style={{color:"#1677FF",fontSize:14}}>→</span> to view Face to Face audit details for specific patients
          </div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"stretch",border:"1px solid #E8E3E3",borderRadius:5,background:"#fff",boxShadow:"0 1px 2px rgba(0,0,0,.03)",overflow:"hidden"}}>
          <div style={{width:88,padding:"0 14px",background:"rgba(247,247,249,0.49)",borderRight:"1px solid #E8E3E3",display:"flex",alignItems:"center",justifyContent:"center",font:"500 14px/18px Roboto",color:"#6B6666",textAlign:"center"}}>F2F Audit<br/>Status</div>
          <div style={{display:"flex",gap:22,padding:"14px 18px"}}>
            {chips.map(c=>(
              <div key={c.label} style={{minWidth:96,paddingTop:8,position:"relative"}}>
                <div style={{position:"absolute",top:0,left:0,right:6,height:4,borderRadius:4,background:c.color,opacity:.65}}></div>
                <div style={{font:"400 14px/18px Roboto",color:"#605D5D",whiteSpace:"nowrap"}}>{c.label}</div>
                <div style={{font:"500 16px/20px Roboto",color:"#605D5D",marginTop:4}}>{c.value}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Automation status line */}
      <div style={{padding:"4px 32px 14px",display:"flex",justifyContent:"flex-end",gap:24,font:"400 13px/18px Roboto",color:"#3A424A"}}>
        <span>Automation (AT) Status :</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}>👍 Completed <span style={{fontWeight:500}}>109</span></span>
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{color:"#D7894A"}}>⚠</span>Needs Attention <span style={{fontWeight:500}}>11</span> <span style={{color:"#8D949D",fontSize:9}}>▾</span></span>
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}>⏳ In Progress <span style={{fontWeight:500}}>00</span></span>
      </div>

      {/* Table */}
      <div style={{padding:"0 32px 40px"}}>
        <div style={{border:"1px solid #E8E9EA",borderRadius:6,background:"#fff",overflow:"hidden"}}>
          {/* header */}
          <div style={{display:"flex",alignItems:"center",padding:"12px 8px",background:"#fff",borderBottom:"1px solid #E8E9EA"}}>
            {cols.map((c,i)=>(
              <div key={i} style={{width:c.w,paddingRight:6,font:"400 12px/14px Roboto",color:"#3A424A",textAlign:c.align||"left",display:"flex",alignItems:"center",justifyContent:c.align==="center"?"center":"flex-start",gap:4}}>
                {c.sort && <span style={{color:"#C0C4CA",fontSize:8,letterSpacing:-1,display:"inline-flex",flexDirection:"column",lineHeight:.5}}>▲▼</span>}
                <span>{c.label}</span>
                {c.info && <span style={{color:"#8D949D",fontSize:11}}>ⓘ</span>}
              </div>
            ))}
          </div>
          {/* rows */}
          {rows.map((r,i)=>{
            const reqMet = r.state==="met";
            const reqException = r.state==="exception";
            return (
              <div key={i} style={{display:"flex",alignItems:"center",padding:"14px 8px",borderBottom:i===rows.length-1?"none":"1px solid #EEF0F3",font:"400 13px/16px Roboto",color:"#3A424A"}}>
                <div style={{width:160,paddingRight:6,fontWeight:400}}>{r.name}</div>
                <div style={{width:158,paddingRight:6}}>{r.mrn}</div>
                <div style={{width:90,paddingRight:6}}>{r.branch}</div>
                <div style={{width:108,paddingRight:6}}>{r.src}</div>
                <div style={{width:92,paddingRight:6}}>{r.soc}</div>
                <div style={{width:108,paddingRight:6,textAlign:"center"}}>{r.trig}</div>
                <div style={{width:104,paddingRight:6}}>{r.date}</div>
                <div style={{width:128,paddingRight:6}}>{r.encDate || ""}</div>
                <div style={{width:138,paddingRight:6}}>{r.dueDate}</div>
                <div style={{width:106,paddingRight:6,textAlign:"center"}}>{r.days || ""}</div>
                <div style={{width:74,paddingRight:6,textAlign:"center",color:"rgb(56,158,13)",fontSize:14}}>{r.sync}</div>
                <div style={{width:78,textAlign:"center"}}>{r.at==="check" ? <span style={{color:"rgb(56,158,13)",fontSize:16}}>✓</span> : <span style={{color:"#D7894A",fontSize:16}}>⚠</span>}</div>
                <div style={{width:96,paddingRight:6}}>{r.auditor}</div>
                <div style={{width:170,textAlign:"center"}}>
                  {reqMet && <span style={{display:"inline-block",padding:"4px 22px",borderRadius:4,background:"#E6F7E0",border:"1px solid #9FCB8A",color:"#1F7A3A",font:"400 13px Roboto",minWidth:120}}>Met</span>}
                  {reqException && <span style={{display:"inline-block",padding:"4px 22px",borderRadius:4,background:"#FFFBE6",border:"1px solid #E5AC42",color:"#D7894A",font:"400 13px Roboto",minWidth:120}}>Exception</span>}
                  {r.state==="notmet" && <span style={{display:"inline-block",padding:"4px 22px",borderRadius:4,background:"#FBE4E4",border:"1px solid #E8A1A1",color:"#B92D2D",font:"400 13px Roboto",minWidth:120}}>Not Met</span>}
                </div>
                <div style={{width:84,textAlign:"center"}}>
                  <button onClick={()=>onOpenDetail(r)} style={{background:"transparent",border:"none",color:"#1677FF",fontSize:20,padding:0}}>→</button>
                </div>
                <div style={{width:88,textAlign:"center"}}>
                  <span style={{display:"inline-block",width:18,height:18,border:"1px solid #D8D8D8",borderRadius:3,background:"#fff"}}></span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </React.Fragment>
  );
}

// ── Screen 2: Audit detail (exception view) ─────────────────────
function AuditDetail({ patient, onClose, onRerun }) {
  return (
    <div style={{position:"fixed",inset:0,background:"#fff",zIndex:50,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",padding:"16px 24px",borderBottom:"1px solid #EEF0F3",gap:18}}>
        <span style={{color:"#1677FF",fontSize:18}}>🩺</span>
        <span style={{font:"500 14px/18px Roboto",color:"#3A424A"}}>{patient.name} - {patient.mrn}</span>
        <span style={{width:1,height:20,background:"#E8E9EA"}}></span>
        <span style={{font:"500 14px/18px Roboto",color:"#3A424A"}}>SOC : {patient.soc}</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:14}}>
          <span style={{font:"400 13px Roboto",color:"#3A424A"}}>F2F Audit Date :</span>
          <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",border:"1px solid #1677FF",borderRadius:4,font:"400 13px Roboto",color:"#1677FF"}}>{patient.soc}-Pre-Bill <span style={{fontSize:9}}>▾</span></span>
          <button onClick={onRerun} style={{display:"inline-flex",alignItems:"center",gap:6,background:"transparent",border:"none",color:"#1677FF",font:"500 14px Roboto"}}>↻ Rerun</button>
          <span style={{width:1,height:20,background:"#E8E9EA"}}></span>
          <button style={{background:"transparent",border:"none",color:"#6A717D",fontSize:18}}>📄</button>
          <span style={{width:1,height:20,background:"#E8E9EA"}}></span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#6A717D",fontSize:18}}>✕</button>
        </div>
      </div>

      <div style={{display:"flex",alignItems:"center",padding:"20px 24px",borderBottom:"1px solid #EEF0F3"}}>
        <div style={{font:"500 15px/18px Roboto",color:"#000",display:"flex",alignItems:"center",gap:14}}>
          F2F Encounter Audit Summary
          <span style={{display:"inline-block",padding:"4px 22px",borderRadius:4,background:"#FFFBE6",border:"1px solid #E5AC42",color:"#D7894A",font:"400 13px Roboto"}}>Exception</span>
        </div>
        <div style={{marginLeft:"22%",font:"400 22px/26px Roboto",color:"#D7894A"}}>Exception Reason</div>
      </div>

      <div style={{flex:1,background:"#fff"}}></div>
    </div>
  );
}

// ── Screen 3: Rerun modal ───────────────────────────────────────
function RerunModal({ patient, onClose, onSubmit }) {
  const [option, setOption] = useState("upload");
  return (
    <div style={{position:"fixed",inset:0,zIndex:60,display:"flex",justifyContent:"flex-end",alignItems:"flex-start"}}>
      <div onClick={onClose} style={{position:"absolute",inset:0,background:"rgba(0,0,0,.08)"}}></div>
      <div onClick={(e)=>e.stopPropagation()} style={{position:"relative",width:380,marginTop:62,marginRight:38,background:"#fff",border:"1px solid #E8E9EA",borderRadius:6,boxShadow:"0 12px 28px rgba(0,0,0,.12)",padding:"18px 18px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{font:"500 15px/18px Roboto",color:"#000"}}>Rerun F2F Audit</div>
            <div style={{font:"400 12px/16px Roboto",color:"#6A717D",marginTop:4}}>{patient.name} -{patient.mrn}</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#6A717D",fontSize:16}}>✕</button>
        </div>
        <div style={{borderTop:"1px solid #EEF0F3",margin:"14px -18px 14px"}}></div>
        <div style={{font:"500 13px/16px Roboto",color:"#3A424A",marginBottom:10}}>Select an Option to Rerun the Audit</div>

        <div style={{display:"flex",gap:10}}>
          {[
            { key:"upload", title:"Upload Documents", desc:"Manually upload the 485/ POC and F2f Documents to rerun the audit", icon:"⬆" },
            { key:"auto",   title:"Auto Extract Latest", desc:"Automatically pull the latest documents from the provider system", icon:"⟳" },
          ].map(o=>{
            const sel = option===o.key;
            return (
              <div key={o.key} onClick={()=>setOption(o.key)} style={{flex:1,cursor:"pointer",padding:"12px 12px 10px",border:`1px solid ${sel?"#1677FF":"#E8E9EA"}`,borderRadius:5,background:sel?"#F0F5FF":"#FAFAFA",position:"relative"}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                  <span style={{width:14,height:14,borderRadius:"50%",border:`1.5px solid ${sel?"#1677FF":"#D8D8D8"}`,marginTop:2,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                    {sel && <span style={{width:7,height:7,borderRadius:"50%",background:"#1677FF"}}></span>}
                  </span>
                  <div style={{flex:1}}>
                    <div style={{font:"500 13px/16px Roboto",color:"#3A424A"}}>{o.title}</div>
                    <div style={{font:"400 11px/14px Roboto",color:"#6A717D",marginTop:4}}>{o.desc}</div>
                  </div>
                </div>
                <div style={{position:"absolute",bottom:8,right:8,width:24,height:24,borderRadius:3,background:"#fff",border:"1px solid #E8E9EA",display:"flex",alignItems:"center",justifyContent:"center",color:"#8D949D",fontSize:12}}>{o.icon}</div>
              </div>
            );
          })}
        </div>

        <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:160,paddingTop:14,borderTop:"1px solid #EEF0F3"}}>
          <button onClick={onClose} style={{background:"#fff",color:"#3A424A",border:"1px solid #D8D8D8",borderRadius:4,padding:"6px 16px",font:"400 13px Roboto"}}>Cancel</button>
          <button onClick={onSubmit} style={{background:"#1677FF",color:"#fff",border:"none",borderRadius:4,padding:"6px 16px",font:"500 13px Roboto"}}>Rerun F2F Audit</button>
        </div>
      </div>
    </div>
  );
}

// ── App router ──────────────────────────────────────────────────
function App() {
  const [detail, setDetail] = useState(null);
  const [rerun,  setRerun]  = useState(false);

  return (
    <div style={{minHeight:"100vh",background:"#fff"}}>
      <TopNav />
      <SectionBand />
      <AuditView onOpenDetail={(r)=>setDetail(r)} />
      {detail && (
        <AuditDetail
          patient={detail}
          onClose={()=>{ setDetail(null); setRerun(false); }}
          onRerun={()=>setRerun(true)}
        />
      )}
      {detail && rerun && (
        <RerunModal
          patient={detail}
          onClose={()=>setRerun(false)}
          onSubmit={()=>setRerun(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
